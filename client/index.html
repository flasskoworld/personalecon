    <!--
      Typography system:
      - Playfair Display  → hero h1, CTA h2 only (editorial / legacy weight)
      - Syne              → dashboard h2/h3, card titles, stat numbers (geometric authority)
      - Space Mono        → eyebrows, labels, buttons, mono data (terminal precision)
      - Inter             → body copy (neutral readability)
      - JetBrains Mono    → in-dashboard numeric data (tabular figures)
    -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,400;1,700&family=Syne:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
